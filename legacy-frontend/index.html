<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaySecure DR — Plain HTML/CSS/JS demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-100 text-slate-900">
  <header class="bg-slate-900 text-white px-5 py-3 flex items-center justify-between">
    <h1 class="font-bold">PaySecure DR — Legacy demo</h1>
    <div class="flex items-center gap-3 text-sm">
      <span id="whoami" class="text-slate-300"></span>
      <button id="logout" class="hidden border border-slate-500 px-3 py-1 rounded">Logout</button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-4">
    <section id="login" class="bg-white rounded-xl p-5 shadow max-w-sm mx-auto">
      <h2 class="font-semibold mb-3">Sign in</h2>
      <form id="login-form" class="space-y-3">
        <input id="email" type="email" class="w-full border rounded px-3 py-2" value="admin@paysecure.local" required />
        <input id="password" type="password" class="w-full border rounded px-3 py-2" placeholder="Password (PaySecure@123)" required />
        <button class="w-full bg-blue-600 text-white rounded py-2 font-semibold">Login</button>
        <p id="login-error" class="text-red-600 text-sm"></p>
      </form>
    </section>

    <section id="app" class="hidden space-y-4">
      <div id="cards" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4"></div>
      <div class="grid gap-4 md:grid-cols-2" id="regions"></div>
      <div class="bg-white rounded-xl p-4 shadow">
        <h2 class="font-semibold mb-2">Runbooks</h2>
        <ul id="runbooks" class="divide-y text-sm"></ul>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
